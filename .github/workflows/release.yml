name: Release

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          # the merge commit and its first parent, the base branch
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install Corepack
        run: npm install -g --force corepack@latest
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn
      - name: Check
        env:
          PR_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'release') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/check-release.mjs

  publish:
    # For a merged pull request, `GITHUB_REF` is the base branch and `GITHUB_SHA` is
    # the merge commit, which the checkout, the provenance and the tag all refer to.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    environment: release

    concurrency:
      group: release
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          # the merge commit and its first parent, the base branch
          fetch-depth: 2
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install Corepack
        run: npm install -g --force corepack@latest
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn
      - name: Build (1)
        run: yarn build core
      - name: Build (2)
        run: yarn build
      # skips the versions that are already published, so a failed run can be retried
      - name: Publish
        run: |-
          yarn config set npmPublishProvenance true
          yarn config set npmRegistryServer https://registry.npmjs.org/
          yarn yakumo publish
      # only a release that changes the version of `cordis` gets a tag and release notes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.pull_request.body }}
        run: |-
          version=$(node -p "require('./packages/core/package.json').version")
          previous=$(git show HEAD^1:packages/core/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          if [ "$version" = "$previous" ]; then
            echo "cordis remains $version"
            exit 0
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "release v$version already exists"
            exit 0
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" \
            --title "Cordis $version" --notes-file "$RUNNER_TEMP/notes.md"
