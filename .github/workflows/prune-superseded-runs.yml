name: Prune superseded runs

on:
  workflow_run:
    # Must match `name:` in build.yml.
    workflows: ["Build"]
    types: [requested]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the runs that would be deleted"
        type: boolean
        default: false
      branch:
        description: "Head branch to prune, e.g. the branch of the pull request"
        required: true
        type: string
      repository:
        description: "Head repository of that branch, as owner/name"
        required: true
        type: string

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete held runs of the same pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name || inputs.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
          SELF_ID: ${{ github.event.workflow_run.id }}
          SELF_CREATED: ${{ github.event.workflow_run.created_at }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          # A run held for approval is never queued, so `concurrency` never
          # replaces it; this job deletes it. Queued runs are left to `concurrency`.
          # ⚠️ Deletion is irreversible and the conditions below are the only
          # gate. They bound the deletion to held (never executed, hence
          # log-less) runs of one head branch of one head repository, which for
          # the `workflow_run` trigger is this very pull request; the gate must
          # never widen.
          # A held run is never queued, so `workflow_run` fires for the newest
          # run only when a push supersedes it — dispatch manually with dry_run
          # to preview, passing the same two coordinates by hand.

          # `workflow_dispatch` carries no `workflow_run` payload: the id is empty
          # there, and `.../workflows//runs` is a 404 under `set -e`.
          if [ -z "$WORKFLOW_ID" ]; then
            WORKFLOW_ID=$(gh api "repos/$REPO/actions/workflows/build.yml" --jq .id)
          fi
          # The same payload is what keeps a push to `main` out: a `main` run shares
          # its head branch with every other run on `main`, so the gate would match
          # runs that are not this pull request's.
          if [ -n "$EVENT" ] && [ "$EVENT" != "pull_request" ]; then
            echo "triggered by '$EVENT', not a pull request; nothing to prune"
            exit 0
          fi
          # A dispatch has neither a self run to exclude nor a timestamp to compare
          # against; every held run of the given branch is older than right now.
          [ -n "$SELF_CREATED" ] || SELF_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .head_repository.full_name, .head_branch, .conclusion, .created_at] | @tsv' \
            > runs.tsv
          while IFS=$'\t' read -r id repo branch conclusion created; do
            [ "$conclusion" = "action_required" ] || continue
            [ "$repo" = "$HEAD_REPO" ] || continue
            [ "$branch" = "$HEAD_BRANCH" ] || continue
            [ "$id" != "$SELF_ID" ] || continue
            [ "$created" \< "$SELF_CREATED" ] || continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry run: would delete run $id"
              continue
            fi
            gh api -X DELETE "repos/$REPO/actions/runs/$id" \
              || echo "delete $id failed; continuing"
          done < runs.tsv
