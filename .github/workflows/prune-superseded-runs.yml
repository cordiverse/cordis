name: Prune superseded runs

on:
  workflow_run:
    # Must match `name:` in build.yml.
    workflows: ["Build"]
    types: [requested]

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete held runs of the same pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SELF_ID: ${{ github.event.workflow_run.id }}
          SELF_CREATED: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          # A run held for approval is never queued, so `concurrency` never
          # replaces it; this job deletes it. Queued runs are left to `concurrency`.
          gh api --paginate "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .head_repository.full_name, .head_branch, .conclusion, .created_at] | @tsv' \
            > runs.tsv
          while IFS=$'\t' read -r id repo branch conclusion created; do
            [ "$conclusion" = "action_required" ] || continue
            [ "$repo" = "$HEAD_REPO" ] || continue
            [ "$branch" = "$HEAD_BRANCH" ] || continue
            [ "$id" != "$SELF_ID" ] || continue
            [ "$created" \< "$SELF_CREATED" ] || continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" \
              || echo "delete $id failed; continuing"
          done < runs.tsv
