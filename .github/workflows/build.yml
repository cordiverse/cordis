name: Build

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install Corepack
        run: npm install -g --force corepack@latest
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn
      - name: Lint
        run: yarn lint

  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn --no-immutable
      - name: Audit production dependencies
        run: yarn npm audit --all --recursive --environment production

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Install Corepack
        run: npm install -g --force corepack@latest
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn
      - name: Build (1)
        run: yarn build core
      - name: Build (2)
        run: yarn build

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [24, 26]

    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Corepack
        run: npm install -g --force corepack@latest
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: yarn
      - name: Unit Test
        run: yarn test:json
